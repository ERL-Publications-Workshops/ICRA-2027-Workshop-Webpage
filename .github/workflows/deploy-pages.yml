name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare website files
        run: |
          mkdir _site
          cp index.html challenge.html call-for-papers.html sponsors-institutions.html styles.css theme.js app.js rov-animation.js hero-shrimps.js .nojekyll _site/
          cp -R assets _site/assets
      - name: Check out publishing repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: shrimp-workshop/shrimp-workshop.github.io
          ref: main
          path: publishing
          ssh-key: ${{ secrets.SHRIMP_PUBLISH_KEY }}
      - name: Publish to shrimp-workshop.github.io
        run: |
          rsync -a --delete --exclude='.git/' --exclude='README.md' _site/ publishing/
          git -C publishing config user.name 'github-actions[bot]'
          git -C publishing config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C publishing add --all
          if ! git -C publishing diff --cached --quiet; then
            git -C publishing commit -m "Publish website from ${GITHUB_SHA::12}"
            git -C publishing push origin HEAD:main
          fi
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
